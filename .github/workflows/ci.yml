name: Verify application
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build deployment image
        run: docker build --tag hit-ci .
      - name: Validate HTTPS proxy configuration
        run: docker run --rm -e SITE_DOMAIN=hit.example.test -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Smoke test production container without sending mail
        shell: bash
        run: |
          trap 'docker rm -fv hit-smoke >/dev/null 2>&1 || true' EXIT
          docker run --detach --name hit-smoke --read-only --tmpfs /tmp -v /app/data -e NODE_ENV=production -e APP_ORIGIN=https://hit.example.test -e HIT_DB=/app/data/hit.sqlite -e MAIL_MODE=smtp -e SMTP_HOST=smtp.example.test -e SMTP_USER=smoke -e SMTP_PASS=smoke-only -e MAIL_FROM=smoke@example.test hit-ci
          for attempt in {1..20}; do
            if docker exec hit-smoke node --input-type=module -e "const health=await fetch('http://127.0.0.1:3000/api/health');const inbox=await fetch('http://127.0.0.1:3000/api/dev/mail');if(!health.ok||inbox.status!==404)process.exit(1)"; then
              exit 0
            fi
            sleep 1
          done
          docker logs hit-smoke
          exit 1
