services:
  app:
    build:
      context: ..
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      TRUST_PROXY: 1
      APP_ORIGIN: ${APP_ORIGIN:?Set a public HTTPS origin}
      HIT_DB: /app/data/hit.sqlite
      MAIL_MODE: smtp
      SMTP_HOST: ${SMTP_HOST:?Configure SMTP host}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?Configure SMTP user}
      SMTP_PASS: ${SMTP_PASS:?Configure SMTP password}
      MAIL_FROM: ${MAIL_FROM:?Configure a verified sender}
    volumes:
      - app-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
  web:
    image: caddy:2
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Configure a domain pointing to this server}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  app-data:
  caddy-data:
  caddy-config:
